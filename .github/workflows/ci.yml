name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret & Supply Chain Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment & DR shell scripts
        run: bash -n infra/scripts/*.sh

  web:
    name: Owner Web Portal (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Enforce zero HIGH/CRITICAL production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report development & production dependency audit summary
        run: |
          node -e '
            const { execSync } = require("child_process");
            let raw = "";
            try {
              raw = execSync("npm audit --json", { encoding: "utf8" });
            } catch (err) {
              raw = err.stdout || "{}";
            }
            const report = JSON.parse(raw || "{}");
            const meta = (report.metadata && report.metadata.vulnerabilities) || {};
            console.log("Total npm audit counts (prod + dev):", JSON.stringify(meta));
            const vulns = report.vulnerabilities || {};
            for (const [name, info] of Object.entries(vulns)) {
              console.log(` - ${name}: severity=${info.severity}, range=${info.range}, fixAvailable=${Boolean(info.fixAvailable)}`);
            }
          '

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"

  api:
    name: Backend & AI API (services/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"

      - run: uv sync --locked --dev
      - run: uvx pip-audit --local
      - run: uv run ruff check .
      - run: uv run mypy .
      - name: Run backend test suite
        env:
          USE_MOCK_GEMINI: "true"
        run: |
          set -o pipefail
          uv run pytest -ra --tb=short 2>&1 | tee "${RUNNER_TEMP}/pytest.log" || {
            grep -E "^(FAILED|ERROR) " "${RUNNER_TEMP}/pytest.log" | head -n 10 | while IFS= read -r line; do
              echo "::error title=pytest failure::${line}"
            done
            TAIL_MSG="$(tail -n 20 "${RUNNER_TEMP}/pytest.log" | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=pytest tail::${TAIL_MSG}"
            echo "### Backend pytest failure tail" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 60 "${RUNNER_TEMP}/pytest.log" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

  mobile:
    name: Android Field App (apps/mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || find "${SDK_DIR}" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          install_sdk_tools() {
            local target_dir="$1"
            mkdir -p "${target_dir}/cmdline-tools"
            curl -fsSL -o "${RUNNER_TEMP}/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
            unzip -q -o "${RUNNER_TEMP}/cmdline-tools.zip" -d "${target_dir}/cmdline-tools"
            rm -rf "${target_dir}/cmdline-tools/latest"
            mv "${target_dir}/cmdline-tools/cmdline-tools" "${target_dir}/cmdline-tools/latest"
            rm -f "${RUNNER_TEMP}/cmdline-tools.zip"
          }
          if [ -z "${SDKMGR}" ] || [ ! -w "${SDK_DIR}" ] || ! "${SDKMGR}" --sdk_root="${SDK_DIR}" --version >/dev/null 2>&1; then
            SDK_DIR="${HOME}/android-sdk"
            install_sdk_tools "${SDK_DIR}"
            SDKMGR="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using Android SDK at ${SDK_DIR} with ${SDKMGR}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "${GITHUB_ENV}"
          echo "${SDK_DIR}/platform-tools" >> "${GITHUB_PATH}"
          echo "$(dirname "${SDKMGR}")" >> "${GITHUB_PATH}"
          (yes || true) | "${SDKMGR}" --sdk_root="${SDK_DIR}" --licenses >/dev/null || true
          "${SDKMGR}" --sdk_root="${SDK_DIR}" --install "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" || \
            "${SDKMGR}" --sdk_root="${SDK_DIR}" --install "platform-tools" "build-tools;36.0.0" || {
              echo "::error title=Android SDK setup failure::sdkmanager failed for SDK_DIR=${SDK_DIR}"
              exit 1
            }

      - uses: gradle/actions/setup-gradle@v4

      - name: Detect production Android signing configuration
        id: signing-config
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || vars.PROD_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${PROD_API_BASE_URL}" ] && [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "has_prod_signing=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_prod_signing=false" >> "${GITHUB_OUTPUT}"
          fi

      - run: chmod +x ./gradlew
      - name: Run Android unit tests & lint
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug --no-daemon --console=plain 2>&1 | tee "${RUNNER_TEMP}/gradle-check.log" || {
            TAIL_MSG="$(tail -n 25 "${RUNNER_TEMP}/gradle-check.log" | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=Android test/lint failure::${TAIL_MSG}"
            echo "### Android testDebugUnitTest / lintDebug failure tail" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 60 "${RUNNER_TEMP}/gradle-check.log" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

      - name: Verify fail-closed production release gate when secrets are unset
        if: steps.signing-config.outputs.has_prod_signing != 'true'
        run: |
          if ./gradlew bundleRelease --no-daemon --console=plain; then
            echo "ERROR: bundleRelease must fail closed when PROD_API_BASE_URL or signing secrets are missing!" >&2
            exit 1
          fi
          echo "Verified: bundleRelease fails closed without production URL & signing credentials."

      - name: Build and verify signed production release (when signing secrets are configured)
        if: steps.signing-config.outputs.has_prod_signing == 'true'
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || vars.PROD_API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/android-release-signing.jks"
          trap 'rm -f "${KEYSTORE_FILE}"' EXIT
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${KEYSTORE_FILE}"
          export ANDROID_KEYSTORE_PATH="${KEYSTORE_FILE}"
          ./gradlew assembleRelease bundleRelease generateReleaseMetadata --no-daemon --console=plain
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Build and verify signed staging APK & AAB (CI verification build)
        if: steps.signing-config.outputs.has_prod_signing != 'true'
        env:
          STAGING_API_BASE_URL: https://staging-api.sitediary.internal
          ANDROID_KEYSTORE_PASSWORD: ci-ephemeral-keystore-pass
          ANDROID_KEY_ALIAS: sitediary-ci-staging
          ANDROID_KEY_PASSWORD: ci-ephemeral-keystore-pass
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/ci-staging-signing.jks"
          trap 'rm -f "${KEYSTORE_FILE}"' EXIT
          keytool -genkeypair -v -keystore "${KEYSTORE_FILE}" -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -keypass "${ANDROID_KEY_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=SiteDiary CI Staging, OU=Engineering, O=SiteDiary, C=PK"
          export ANDROID_KEYSTORE_PATH="${KEYSTORE_FILE}"
          ./gradlew assembleStaging bundleStaging generateReleaseMetadata --no-daemon --console=plain
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --verbose --print-certs app/build/outputs/apk/staging/app-staging.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/staging/app-staging.aab
          cat app/build/outputs/release-metadata/staging/build-metadata.json

      - name: Stage signed build artifacts for upload
        run: |
          mkdir -p "${RUNNER_TEMP}/android-artifacts"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/android-artifacts/"
            cp app/build/outputs/bundle/release/app-release.aab "${RUNNER_TEMP}/android-artifacts/"
            cp app/build/outputs/release-metadata/release/build-metadata.json "${RUNNER_TEMP}/android-artifacts/"
          else
            cp app/build/outputs/apk/staging/app-staging.apk "${RUNNER_TEMP}/android-artifacts/"
            cp app/build/outputs/bundle/staging/app-staging.aab "${RUNNER_TEMP}/android-artifacts/"
            cp app/build/outputs/release-metadata/staging/build-metadata.json "${RUNNER_TEMP}/android-artifacts/"
          fi
          if [ -f ../../RELEASE_NOTES.md ]; then
            cp ../../RELEASE_NOTES.md "${RUNNER_TEMP}/android-artifacts/RELEASE_NOTES.md"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-artifacts
          path: ${{ runner.temp }}/android-artifacts/
          retention-days: 7
