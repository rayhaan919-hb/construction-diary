[project]
name = "site-diary-api"
version = "1.0.0"
description = "Construction Permit & Site Diary FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14.0,<2.0",
  "argon2-cffi>=23.1.0,<26.0",
  "email-validator>=2.2.0,<3.0",
  "fastapi>=0.115.0,<1.0",
  "google-auth>=2.35.0,<3.0",
  "google-cloud-storage>=2.18.0,<4.0",
  "google-genai>=1.0.0,<2.0",
  "httpx>=0.27.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "PyJWT>=2.9.0,<3.0",
  "psycopg[binary]>=3.2.0,<4.0",
  "sqlalchemy>=2.0.35,<2.1",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pgserver>=0.1.4",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["pgserver.*", "google.cloud.*", "tzdata"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
